name: Release

on:
  push:
    branches:
      - main
      - next
      - beta
      - alpha
  # Allows a release to be retried after fixing an external setting, such as
  # an expired RELEASE_TOKEN, without creating an empty commit.
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
      # Check the credential before checkout so an expired or missing token is
      # reported directly instead of surfacing later as an ambiguous git error.
      - name: Verify RELEASE_TOKEN
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error title=RELEASE_TOKEN missing::The RELEASE_TOKEN secret is not available to this repository. semantic-release pushes its release commit to protected branches, so the default GITHUB_TOKEN cannot be used. Add the PAT for the ruleset bypass identity and grant it access to this repository."
            exit 1
          fi

          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $RELEASE_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/user || echo "000")

          if [ "$status" != "200" ]; then
            echo "::error title=RELEASE_TOKEN rejected::GitHub returned HTTP $status for RELEASE_TOKEN. The PAT is expired, revoked, or invalid; replace the secret before retrying this workflow."
            exit 1
          fi

          echo "RELEASE_TOKEN accepted by the GitHub API."

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}
          persist-credentials: true

      # Pinned rather than lts/*: npm trusted publishing (OIDC) requires npm
      # >= 11.5.1 and Node >= 22.14.0. Node 22 LTS still ships npm 10.9.x, so
      # if lts/* ever resolved to the 22 line the OIDC token exchange would
      # fail and semantic-release would silently fall back to token auth -
      # which, with no NPM_TOKEN configured, fails the release. Node 24 ships
      # npm 11.17+, and 24 is one of the two versions the test matrix covers.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: "npm"

      - name: Verify npm supports trusted publishing
        run: |
          npm_version=$(npm --version)
          echo "npm $npm_version, node $(node --version)"
          required=11.5.1
          if [ "$(printf '%s\n%s\n' "$required" "$npm_version" | sort -V | head -n1)" != "$required" ]; then
            echo "::error::npm $npm_version is below $required, which trusted publishing (OIDC) requires."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release
