name: Test Suite

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]

permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        persist-credentials: false
        # Preserve the default PR merge checkout; retain history for patch coverage.
        fetch-depth: 0

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    # Pin npm so every job resolves the lockfile identically. Node 22 bundles
    # npm 10 and Node 24 bundles npm 11, and the two disagree about lockfile
    # resolution - a desync that npm 11 installs silently makes npm 10 fail
    # with EUSAGE. That is exactly how #26 went red on the 22.x leg while
    # passing locally.
    - name: Pin npm
      run: npm install -g npm@11

    - name: Install dependencies
      run: npm ci

    - name: Run type checking
      run: npm run typecheck

    - name: Build project
      run: npm run build

    - name: Run unit tests
      run: npm run test:unit

    - name: Run integration tests
      run: npm run test:integration

    - name: Run e2e tests
      run: npm run test:e2e

    # Coverage is identical across the matrix, so generate and upload it once.
    # Running it on every entry produced duplicate Codecov uploads for the
    # same commit and made the project/patch status flaky.
    - name: Enforce changed-line and branch coverage
      if: matrix.node-version == '22.x'
      env:
        COVERAGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        COVERAGE_HEAD: ${{ github.sha }}
        COVERAGE_PR_HEAD: ${{ github.event.pull_request.head.sha }}
      run: |
        args=(--base "$COVERAGE_BASE" --head "$COVERAGE_HEAD")
        if [[ -n "$COVERAGE_PR_HEAD" ]]; then args+=(--pr-head "$COVERAGE_PR_HEAD"); fi
        npm run test:coverage:patch -- "${args[@]}"

    - name: Archive coverage report
      if: always() && matrix.node-version == '22.x'
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report
        path: coverage/

  coverage-upload:
    name: Upload Coverage
    needs: test
    if: github.repository == 'kdpa-llc/mcp-compression-proxy'
    runs-on: ubuntu-latest
    # Keep upload identity out of the job that installs and executes dependencies.
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Checkout measured source
      uses: actions/checkout@v7
      with:
        ref: ${{ github.sha }}
        persist-credentials: false

    - name: Download validated coverage report
      uses: actions/download-artifact@v8
      with:
        name: coverage-report
        path: coverage/

    - name: Verify coverage provenance
      shell: bash
      env:
        COVERAGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        COVERAGE_PR_HEAD: ${{ github.event.pull_request.head.sha }}
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        report_hash=$(sha256sum coverage/lcov.info | cut -d' ' -f1)
        jq -e --arg head "$GITHUB_SHA" \
          --arg tree "$(git rev-parse 'HEAD^{tree}')" \
          --arg base "$COVERAGE_BASE" --arg pr_head "$COVERAGE_PR_HEAD" \
          --arg lcov_hash "$report_hash" '
          .headSha == $head and .testedTreeSha == $tree and
          .baseSha == $base and (.prHeadSha // "") == $pr_head and
          .lcovSha256 == $lcov_hash and .status == "passed" and .failures == []
        ' coverage/patch-coverage.json > /dev/null

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage/lcov.info
        disable_search: true
        flags: unittests
        name: codecov-22.x
        fail_ci_if_error: true
        use_oidc: true

  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22.x'
        cache: 'npm'

    # Pin npm so every job resolves the lockfile identically. Node 22 bundles
    # npm 10 and Node 24 bundles npm 11, and the two disagree about lockfile
    # resolution - a desync that npm 11 installs silently makes npm 10 fail
    # with EUSAGE. That is exactly how #26 went red on the 22.x leg while
    # passing locally.
    - name: Pin npm
      run: npm install -g npm@11

    - name: Install dependencies
      run: npm ci

    - name: Run type checking
      run: npm run typecheck

    - name: Run linter
      run: npm run lint

    # Guards the one release step CI otherwise never exercises. semantic-release
    # resolves the changelog preset by name at runtime, so a dependency bump can
    # make generateNotes fail - after npm publish has already succeeded. A
    # --dry-run cannot catch this on a PR: it exits early on a non-release
    # branch. This calls the plugin's real generateNotes instead.
    - name: Verify release notes can be generated
      run: npm run check:release-notes

  build:
    name: Build Project
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22.x'
        cache: 'npm'

    # Pin npm so every job resolves the lockfile identically. Node 22 bundles
    # npm 10 and Node 24 bundles npm 11, and the two disagree about lockfile
    # resolution - a desync that npm 11 installs silently makes npm 10 fail
    # with EUSAGE. That is exactly how #26 went red on the 22.x leg while
    # passing locally.
    - name: Pin npm
      run: npm install -g npm@11

    - name: Install dependencies
      run: npm ci

    - name: Build project
      run: npm run build

    - name: Check build artifacts
      run: |
        if [ ! -d "dist" ]; then
          echo "Build failed: dist directory not found"
          exit 1
        fi
        echo "Build successful"
