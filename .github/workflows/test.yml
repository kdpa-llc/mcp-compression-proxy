name: Test Suite

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    # Pin npm so every job resolves the lockfile identically. Node 22 bundles
    # npm 10 and Node 24 bundles npm 11, and the two disagree about lockfile
    # resolution - a desync that npm 11 installs silently makes npm 10 fail
    # with EUSAGE. That is exactly how #26 went red on the 22.x leg while
    # passing locally.
    - name: Pin npm
      run: npm install -g npm@11

    - name: Install dependencies
      run: npm ci

    - name: Run type checking
      run: npm run typecheck

    - name: Build project
      run: npm run build

    - name: Run unit tests
      run: npm run test:unit

    - name: Run integration tests
      run: npm run test:integration

    - name: Run e2e tests
      run: npm run test:e2e

    # Coverage is identical across the matrix, so generate and upload it once.
    # Running it on every entry produced duplicate Codecov uploads for the
    # same commit and made the project/patch status flaky.
    - name: Generate coverage report
      if: matrix.node-version == '22.x'
      run: npm run test:coverage

    - name: Upload coverage to Codecov
      if: matrix.node-version == '22.x'
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage/lcov.info
        flags: unittests
        name: codecov-${{ matrix.node-version }}
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: Archive coverage report
      if: always() && matrix.node-version == '22.x'
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report
        path: coverage/

  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22.x'
        cache: 'npm'

    # Pin npm so every job resolves the lockfile identically. Node 22 bundles
    # npm 10 and Node 24 bundles npm 11, and the two disagree about lockfile
    # resolution - a desync that npm 11 installs silently makes npm 10 fail
    # with EUSAGE. That is exactly how #26 went red on the 22.x leg while
    # passing locally.
    - name: Pin npm
      run: npm install -g npm@11

    - name: Install dependencies
      run: npm ci

    - name: Run type checking
      run: npm run typecheck

    - name: Run linter
      run: npm run lint

  build:
    name: Build Project
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22.x'
        cache: 'npm'

    # Pin npm so every job resolves the lockfile identically. Node 22 bundles
    # npm 10 and Node 24 bundles npm 11, and the two disagree about lockfile
    # resolution - a desync that npm 11 installs silently makes npm 10 fail
    # with EUSAGE. That is exactly how #26 went red on the 22.x leg while
    # passing locally.
    - name: Pin npm
      run: npm install -g npm@11

    - name: Install dependencies
      run: npm ci

    - name: Build project
      run: npm run build

    - name: Check build artifacts
      run: |
        if [ ! -d "dist" ]; then
          echo "Build failed: dist directory not found"
          exit 1
        fi
        echo "Build successful"
