name: Setup Trusted Publishing

# One-shot bootstrap, run by hand.
#
# Registers this repository and release.yml as a trusted publisher for the
# package on npm, so releases authenticate over OIDC instead of a stored
# token. Run it once; after that NPM_TOKEN can be revoked or left to expire.
#
# It runs here rather than on a laptop so NPM_TOKEN is used where it already
# lives. The token is never printed - npm reads it from the environment, and
# the summary below reports only the resulting configuration.
on:
  workflow_dispatch:
    inputs:
      revoke_id:
        description: "Trust ID to revoke instead of creating one (leave blank to create)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  trust:
    name: Configure npm trusted publisher
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # npm trust requires the same floor as trusted publishing itself.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"

      - name: Verify npm supports trusted publishing
        run: |
          npm_version=$(npm --version)
          echo "npm $npm_version, node $(node --version)"
          required=11.5.1
          if [ "$(printf '%s\n%s\n' "$required" "$npm_version" | sort -V | head -n1)" != "$required" ]; then
            echo "::error::npm $npm_version is below $required, which trusted publishing requires."
            exit 1
          fi

      - name: Show existing trusted publishers
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=\${NPM_TOKEN}" > ~/.npmrc
          npm trust list mcp-compression-proxy || echo "(none configured yet)"

      - name: Revoke trusted publisher
        if: inputs.revoke_id != ''
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm trust revoke mcp-compression-proxy --id="${{ inputs.revoke_id }}" --yes

      - name: Create trusted publisher
        if: inputs.revoke_id == ''
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm trust github mcp-compression-proxy \
            --repository kdpa-llc/mcp-compression-proxy \
            --file release.yml \
            --allow-publish \
            --yes

      - name: Confirm resulting configuration
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "### npm trusted publishers" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          npm trust list mcp-compression-proxy >> "$GITHUB_STEP_SUMMARY" 2>&1
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          npm trust list mcp-compression-proxy

      - name: Remove credentials from the runner
        if: always()
        run: rm -f ~/.npmrc
